{% extends 'base.html' %}

{% block title %}
{% if form.instance.articulo_id %}Editar{% else %}Nuevo{% endif %} Artículo
{% endblock %}

{% block content %}
<h2>{% if form.instance.articulo_id %}Editar{% else %}Nuevo{% endif %} Artículo</h2>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Código de Artículo</label>
                <input type="text" name="codigo_articulo" class="form-control" 
                       value="{{ form.codigo_articulo.value|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" name="descripcion" class="form-control" 
                       value="{{ form.descripcion.value|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Grupo</label>
                <select name="grupo" class="form-select" required>
                    <option value="">Seleccione</option>
                    {% for grupo in form.grupo.field.queryset %}
                    <option value="{{ grupo.pk }}">{{ grupo }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Línea</label>
                <select name="linea" class="form-select" required>
                    <option value="">Seleccione</option>
                    {% for linea in form.linea.field.queryset %}
                    <option value="{{ linea.pk }}">{{ linea }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input type="number" name="stock" class="form-control" 
                       value="{{ form.stock.value|default:'0' }}" step="0.01">
            </div>

            <h5>Precios</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Precio 1</label>
                    <input type="number" name="precio_1" class="form-control" 
                           value="{{ precio_form.precio_1.value|default:'0' }}" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Precio Compra</label>
                    <input type="number" name="precio_compra" class="form-control" 
                           value="{{ precio_form.precio_compra.value|default:'0' }}" step="0.01" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'articulos_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
